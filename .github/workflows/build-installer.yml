name: Build installer with upstream HTTPS fixes
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out unmodified official source
        uses: actions/checkout@v4
        with:
          repository: e1z0/PS4-Games-Installer
          ref: f9212596bafd1011aec594cd8c5bd0d05cff938a
          persist-credentials: false
      - name: Check out catalog build fix
        uses: actions/checkout@v4
        with:
          path: .catalog-build
          persist-credentials: false
      - name: Apply bounded response-header fix and record source
        run: |
          python3 .catalog-build/scripts/patch_installer_headers.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('revision.json')
          state = json.loads(p.read_text())
          state['revision'] = 48
          p.write_text(json.dumps(state, indent=2) + '\n')
          PY
          git add src/http.cpp src/http_native.hpp tests/http_native_test.cpp revision.json
          git -c user.name='Catalog build' -c user.email='build@users.noreply.github.com' \
            -c commit.gpgsign=false commit -m 'Allow bounded 64 KiB native HTTP response headers'
      - name: Build upstream toolchain image
        run: make image
      - name: Build and validate existing installer
        run: make package
      - name: Adapt upstream host-only logging test harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('src/log.cpp')
          text = log.read_text()
          old = '        sceKernelDebugOutText(0, fallback);'
          assert text.count(old) == 1
          text = text.replace(old, '#ifdef PSGI_HOST\n        fputs(fallback, stdout);\n#else\n' + old + '\n#endif')
          log.write_text(text)
          makefile = Path('Makefile')
          text = makefile.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('build/host/http-native-test:'):
                  lines[i] = line.replace('$(HEADERS)', 'build/host/common/log.o $(HEADERS)')
                  break
          else:
              raise RuntimeError('Upstream native HTTP test target missing')
          makefile.write_text('\n'.join(lines) + '\n')
          import re
          fixture = Path('tests/http_native_test.cpp')
          text = fixture.read_text()
          text = text.replace('const std::string caOne =', 'const std::string letsEncryptCa = "-----BEGIN CERTIFICATE-----\\r\\nRA==\\r\\n-----END CERTIFICATE-----\\r\\n";\nconst std::string caOne =')
          text = re.sub(r'(retainedCaList|certificates)\[(\d+)\]', lambda m: m[1] + '[' + str(int(m[2]) + 1) + ']', text)
          text = text.replace('assert(count == 3', 'assert(count == 4')
          text = text.replace('ca=3', 'ca=4')
          text = text.replace('    assert(std::string(retainedCaList[1]', '    assert(std::string(retainedCaList[0]->ptr, retainedCaList[0]->size) == letsEncryptCa);\n    assert(std::string(retainedCaList[1]', 1)
          text = text.replace('    assert(std::string(certificates[1]', '    assert(std::string(certificates[0]->ptr, certificates[0]->size) == letsEncryptCa);\n    assert(std::string(certificates[1]', 1)
          old = '    writeCa(intermediateCa, intermediatePath);'
          assert text.count(old) == 1
          text = text.replace(old, old + '''
              std::remove("build/host/letsencrypt-gen-y.pem");
              rejects([&] { psgi::prepareHttpTrust(); }, "Cannot open"); networkReleased();
              writeCa(letsEncryptCa, "build/host/letsencrypt-gen-y.pem");
              rejects([&] { psgi::prepareHttpTrust(); }, "Expected two"); networkReleased();
              writeCa(letsEncryptCa + caOne, "build/host/letsencrypt-gen-y.pem");
          ''')
          fixture.write_text(text)
          startup = Path('tests/startup_test.py')
          text = startup.read_text()
          old = '"godaddy-secure-g2.pem"):'
          assert text.count(old) == 1
          startup.write_text(text.replace(old, '"godaddy-secure-g2.pem", "letsencrypt-gen-y.pem"):'))
          PY
          git diff -- src/log.cpp Makefile tests/http_native_test.cpp tests/startup_test.py > dist/host-test-harness.patch
      - name: Run upstream regression tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            -e SDL_VIDEODRIVER=dummy -e PSGI_IN_CONTAINER=1 \
            ps4-games-installer:build make -j2 test
      - name: Restore exact package source before validation
        run: git restore --source=HEAD -- src/log.cpp Makefile tests/http_native_test.cpp tests/startup_test.py
      - name: Verify package manifest
        run: make validate
      - name: Include source and build provenance
        run: |
          git archive --format=tar.gz --output=dist/upstream-source.tar.gz HEAD
          printf '%s\n' f9212596bafd1011aec594cd8c5bd0d05cff938a > dist/UPSTREAM_COMMIT.txt
          git rev-parse HEAD > dist/BUILD_COMMIT.txt
          git show --format= HEAD -- src/http.cpp src/http_native.hpp tests/http_native_test.cpp revision.json > dist/installer-response-headers.patch
          printf '%s\n' 'Local build of e1z0/PS4-Games-Installer with a bounded response-header fix.' \
            'Not an official upstream release. Hardware compatibility must be tested.' \
            'Built with the upstream Dockerfile, pinned OpenOrbis SDK and package validator.' \
            'Source archive includes the native header fix; installer-response-headers.patch records the production changes.' \
            'host-test-harness.patch only adapts Linux test fixtures after packaging; those changes are not in the PS4 binary.' \
            > dist/BUILD-NOTES.txt
          sha256sum dist/*.pkg > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-installer-https-fixes
          path: dist/
          retention-days: 30
          if-no-files-found: error
