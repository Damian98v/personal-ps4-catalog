name: Check package links
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_catalog.py --online --report reports/links.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-link-report
          path: reports/links.json
          retention-days: 30
